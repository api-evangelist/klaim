aid: klaim
name: Klaim
description: Klaim (Klaim Kapital Technologies Limited / Klaim Holdings Limited) is an Abu Dhabi-founded,
  UAE-based healthcare fintech that advances working capital against receivables. Healthcare providers,
  real estate brokers and SMEs submit unpaid insurance claims or invoices, Klaim's AI evaluates and prices
  the risk in real time, and Klaim advances up to 90% of face value within 24 hours, collecting only when
  the payer or client settles. Products span Klaim Health (insurance claim advances plus AI denial
  prediction), Klaim Flow (SME receivables purchasing with an escrow model), Klaim Estate (real estate
  commission advances) and Klaim Eligible (insurance eligibility verification). Founded in December 2019
  by Karim Dakki and Ahmad Ghafour, backed by Techstars, and operating across the GCC, North Africa and
  Turkey. Klaim publishes no public developer portal, API documentation or machine-readable API
  description at this time.
